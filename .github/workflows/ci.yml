name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Formatacao
        run: ruff format --check .

      - name: Testes
        run: pytest -v

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Formatacao
        run: terraform fmt -check -recursive

      # O empacotamento usa o pip para baixar wheels Linux / Python 3.12.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # Gera build/lambda.zip, exigido pelo terraform validate (filebase64sha256),
      # e falha se o pacote passar de 245 MB descompactado.
      - name: Empacotar Lambda
        run: python ../scripts/empacotar.py

      - name: Init sem backend
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate
